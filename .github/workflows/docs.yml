name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'tex/**'
      - 'scripts/build_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tex/**'
      - 'scripts/build_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Full TeX Live 2026, built 2026-07-01; includes the June LaTeX kernel.
    container: ghcr.io/xu-cheng/texlive-debian@sha256:c21af17c2380cc456427fe2c49df89c6dcb3d998f522c4087414a21d4c0deb9f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install preview tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 poppler-utils ghostscript
      - name: Compile and validate runnable examples
        run: python3 scripts/build_docs.py --examples-only
      - name: Retain example output and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-examples
          path: |
            build/docs/examples
            build/docs/examples-report.json
          retention-days: 7

  site:
    needs: examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: docs/guide/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/build/docs/gems
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.5'
          bundler: '4.0.12'
      - run: bundle install
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: documentation-examples
          path: build/docs
      - name: Build and validate the website
        run: python3 scripts/build_docs.py --site-only
      - name: Upload reviewable website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: build/docs/site
          retention-days: 7
      - name: Configure Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/docs/site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish guide
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
