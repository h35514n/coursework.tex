title: Coursework
description: Documentation for the Coursework XeLaTeX classes, shared notation, and environments.
url: https://h35514n.github.io
baseurl: /coursework.tex
theme: just-the-docs
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  focus_shortcut_key: k
  tokenizer_separator: '/[\s\\/]+/'
enable_copy_code_button: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  "Source on GitHub":
    - https://github.com/h35514n/coursework.tex
footer_content: 'Coursework v2 · XeLaTeX classes for homework and reading notes.'
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - api.json
  - examples.json
  - CONTRIBUTING.md
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
